<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouped Station Safety Dashboard</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='grouped_styles.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-section hero">
                <p class="eyebrow">Grouped Counter Experiment</p>
                <h1>Nearby paired counters merged into grouped 1.0 km bike-only entities</h1>
                <p class="lede">
                    This is a separate experiment app. It merges nearby related counters before
                    historical ranking and next-month prediction.
                </p>
            </div>

            <div class="sidebar-section controls">
                <div class="control-grid">
                    <label>
                        <span>Ranking mode</span>
                        <select id="mode-select">
                            <option value="historical" selected>Historical risk</option>
                            <option value="forecast">Forecast risk</option>
                        </select>
                    </label>
                    <label>
                        <span>Group search</span>
                        <input id="search-input" type="text" placeholder="Search grouped counter name">
                    </label>
                    <label>
                        <span>Municipality</span>
                        <select id="municipality-select">
                            <option value="">All municipalities</option>
                        </select>
                    </label>
                    <label>
                        <span>View</span>
                        <select id="view-select">
                            <option value="all" selected>All groups</option>
                            <option value="top50">Top 50 riskiest</option>
                            <option value="bottom50">Top 50 safest</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="sidebar-section" id="radius-summary"></div>
            <div class="sidebar-section" id="station-detail"></div>

            <div class="sidebar-section evidence">
                <h2>Method and Evidence</h2>
                <ul id="method-evidence"></ul>
            </div>
        </aside>

        <main class="map-panel">
            <div class="map-wrapper">
                <div id="map"></div>
            </div>
        </main>
    </div>

    <script>
        window.APP_BOOTSTRAP = {{ bootstrap|tojson }};
    </script>
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="{{ url_for('static', filename='grouped_app.js') }}"></script>
</body>
</html>
